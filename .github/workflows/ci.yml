name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: errand
          POSTGRES_PASSWORD: errand
          POSTGRES_DB: errandconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U errand" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - name: Formatting
        run: npm run format:check

      - name: Shared package
        run: npx vitest run
        working-directory: packages/shared

      - name: API - lint, typecheck, unit tests
        working-directory: apps/api
        run: |
          npx prisma generate
          npm run lint
          npx tsc --noEmit -p tsconfig.json
          npm test
      - name: API - end-to-end tests
        working-directory: apps/api
        run: npm run test:e2e

      - name: Admin panel - lint, typecheck, build
        working-directory: apps/admin
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Mobile app - lint and typecheck
        working-directory: apps/mobile
        run: |
          npx eslint src
          npm run typecheck

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          build-args: NEXT_PUBLIC_API_URL=https://api.example.com
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
